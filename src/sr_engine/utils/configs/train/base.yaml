# Training Configuration
seed: 42
batch_size: 32
num_workers: 4
patch_size: 128
learning_rate: 2e-4
weight_decay: 0.0
betas: [0.9, 0.99]

# --- Epoch-based settings ---
max_epochs: 10
save_per_epoch: 5
checkpoint_dir: "experiments/checkpoints"
# Log metrics every N batches (JSONL + SSE events). Higher = less I/O overhead.
metrics_frequency: 10

# --- Validation ---
validation:
  enabled: true
  split: 0.1
  # Fixed seed for the train/validation split — independent of the general
  # "seed" (which controls random patches). Keeps the same images in train
  # and validation across recurring train phases of the same dataset.
  split_seed: 1234
  # Cap for the slow tiled full-image validation pass (images per epoch).
  # The patch-based PSNR/SSIM/loss still cover the whole validation set.
  # 0 disables the full-image pass entirely.
  full_image_limit: 8
  # Run the full-image validation pass on the selected device (GPU). Set true
  # to offload it to a throwaway CPU model copy instead (keeps GPU idle).
  offload_cpu: false

# --- Training dynamics ---
lr_scheduler: cosine
warmup_steps: 2000
min_lr: 1e-7

# Run one synthetic forward+backward before the epoch loop so the one-time
# MIOpen/cuDNN kernel autotune search happens up-front instead of stalling the
# first epoch's batches. Chosen kernels are reused for the whole run and cached
# in MIOpen's find-db for subsequent runs. Disable for very short runs where
# the warmup cost outweighs the per-step speedup.
benchmark_warmup: true

# --- Mixed precision ---
dtype: float32  # "bf16" enables bfloat16, "float16" enables fp16 + GradScaler

# --- VRAM / memory ---
# Recompute activations during backward instead of storing them (trades compute
# for memory, ~4-6x fewer activations for transformer archs). "auto" enables it
# for transformer architectures (swinir) and disables it for conv ones (rrdb).
gradient_checkpointing: auto
# Compute pixel + VGG losses in bf16 even during fp32 training (halves loss-side
# activation memory on GPUs that support bf16).
loss_bf16: true

# --- Losses ---
# Each loss is a named entry with a "type" and "weight".
# Available types: l1, l2, vgg, edge, style, fft, ssim, lpips
# Type-specific params are passed as extra keys (e.g. layers for vgg/style).
losses:
  pixel:
    type: l1
    weight: 1.0
  perceptual:
    type: vgg
    weight: 0.1
    layers: ["relu5_4"]
  # Uncomment to enable additional losses:
  # edge:
  #   type: edge
  #   weight: 0.05
  # style:
  #   type: style
  #   weight: 0.01
  #   layers: ["relu1_2", "relu2_2", "relu3_4", "relu4_4", "relu5_2"]
  # fft:
  #   type: fft
  #   weight: 0.01
  # ssim:
  #   type: ssim
  #   weight: 0.1
  # lpips:
  #   type: lpips
  #   weight: 0.1